on:
  push:
    branches: [master]

name: Quarto Publish

permissions:
  contents: read
  pages: write
  id-token: write

# Deploys the pre-rendered _book/ committed to master. The Julia book depends
# on local research packages, so CI should not try to instantiate and render
# the full project on a clean runner. Render locally, commit _book/, and let CI
# only upload and deploy the generated site.

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
